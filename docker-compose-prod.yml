version: "3.4"

services:
  reverse-proxy:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"

      # HTTP entry point
      - "--entryPoints.web.address=:80"
      # HTTPS entry point
      - "--entryPoints.websecure.address=:443"

      # Redirect HTTP to HTTPS
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"

      # Let's Encrypt configuration
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=daniel@meloptica.stream"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      # HTTP
      - "80:80"
      # HTTPS
      - "443:443"
      # Web UI (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      - letsencrypt:/letsencrypt
      # So that Traefik can listen to Docker events
      - /var/run/docker.sock:/var/run/docker.sock
  api:
    build:
      context: ./backend
      dockerfile: dockerfile
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
    volumes:
      - /mnt/data/image-storage:/app/images
      - /mnt/data/sound-storage:/app/sounds
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__WebApiDatabase=server=mysql;port=3306;database=musify;user=${MYSQL_ROOT_USER};password=${MYSQL_ROOT_PASSWORD}
      - ImageSettings__ImageFolderPath=/app/images
      - SoundSettings__SoundFolderPath=/app/sounds
      - Jwt_Secret=${Jwt_Secret}
      - Jwt_Issuer=${Jwt_Issuer_Docker}
      - Jwt_Audience=${Jwt_Audience_Docker}
    depends_on:
      - mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.meloptica.stream`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - /mnt/data/mysql-data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`meloptica.stream`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  image-storage:
    driver: local
    driver_opts:
      type: none
      device: /mnt/data/image-storage
      o: bind
  sound-storage:
    driver: local
    driver_opts:
      type: none
      device: /mnt/data/sound-storage
      o: bind
  mysql-data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/data/mysql-data
      o: bind
  letsencrypt:
